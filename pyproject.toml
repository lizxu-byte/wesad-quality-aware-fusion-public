[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wesad-quality-aware-fusion"
version = "0.1.0"
description = "Signal-quality-aware multimodal fusion for stress detection on WESAD"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # WESAD loader conventions, PPG pipeline + SQIs, ECG R-peak detector, windows / calibration / LOSO helpers.
    # Pinned to an exact commit for reproducibility.
    "ahr @ git+https://github.com/lizxu-byte/ahr-stress-trigger-public@02357a98322db2f50561524d3d445b3883bde12f",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
